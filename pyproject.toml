[project]
name = "cover-letter-cli"
version = "0.1.0"
description = "Local-first CLI for writing cover letters (job and reselling inquiries) through an OpenAI-compatible endpoint, default Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cover-letter = "cover_letter_cli.cli:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cover_letter_cli*"]
